name: pgck

services:
  postgres:
    container_name: pgck-postgres
    # trixie (Debian 13, glibc 2.41), NOT bookworm. pgRDF v0.6.20 is pg18-only and
    # its .so requires GLIBC_2.38 — bookworm ships 2.36, so the pg17-era bookworm
    # pin can't load the pg18 pgrdf.so ("version `GLIBC_2.38' not found"). trixie is
    # the natural pg18 base (plain postgres:18 == trixie) and clears the floor. The
    # pg17-bookworm SONAME guardrail lifts for pg18: downstream ck-allinone pg18 must
    # likewise be built on a glibc>=2.38 base (trixie/noble), never bookworm.
    image: docker.io/library/postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgck}
      POSTGRES_DB: ${POSTGRES_DB:-pgck}
    # 0.4.79 — THE RIG NAMES ITS KERNEL, like every real deployment. Until now an
    # unset ckp.project silently resolved to the project 'demo' — an example that
    # entered on the repo's first day and became the jurisdiction of every
    # unattributed write (finding-1787292096161920000). The name here is unchanged,
    # because this volume's kernel graph and instances genuinely live under it; what
    # changed is that it is now a DECLARED CHOICE rather than an invention nothing
    # could refuse. The bundles pin the same pair in pgck.conf.
    command: [postgres, -c, "shared_preload_libraries=pgrdf,pgck", -c, "ckp.project=demo"]
    ports: ["${POSTGRES_PORT:-5432}:5432", "${NATS_PORT:-4222}:4222"]
    volumes:
      # postgres:18+ images store data in a major-version subdir and REFUSE a
      # volume mounted directly at /var/lib/postgresql/data (they error to guard
      # against a silent cross-major reuse — docker-library/postgres#1259). The
      # supported 18+ layout mounts the PARENT; data then lands in
      # /var/lib/postgresql/18/docker inside the volume. This is the pg17→pg18
      # switch's one compose gotcha (the .so/ABI moved cleanly).
      - pgdata:/var/lib/postgresql
      - ./extensions/pgrdf/lib/pgrdf.so:/usr/lib/postgresql/18/lib/pgrdf.so:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf.control:/usr/share/postgresql/18/extension/pgrdf.control:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf--0.6.34.sql:/usr/share/postgresql/18/extension/pgrdf--0.6.34.sql:ro,z
      # Complete SQL set per oci-germination packaging (ship the whole share/extension,
      # not just the base install). A stock postgres image is bind-mounted here, so the
      # whole-dir COPY the bundles use would shadow built-in pgcrypto/plpgsql — instead
      # mount every pgrdf--*.sql the 0.6.34 tarball ships. The upgrade script is inert for
      # the warm fresh-install path but keeps ALTER EXTENSION UPDATE resolvable and the
      # mount set == the published artifact's extension dir. Update both filenames on bump.
      - ./extensions/pgrdf/share/extension/pgrdf--0.5.1--0.6.32.sql:/usr/share/postgresql/18/extension/pgrdf--0.5.1--0.6.32.sql:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf--0.6.22--0.6.25.sql:/usr/share/postgresql/18/extension/pgrdf--0.6.22--0.6.25.sql:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf--0.6.25--0.6.26.sql:/usr/share/postgresql/18/extension/pgrdf--0.6.25--0.6.26.sql:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf--0.6.26--0.6.27.sql:/usr/share/postgresql/18/extension/pgrdf--0.6.26--0.6.27.sql:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf--0.6.27--0.6.28.sql:/usr/share/postgresql/18/extension/pgrdf--0.6.27--0.6.28.sql:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf--0.6.28--0.6.29.sql:/usr/share/postgresql/18/extension/pgrdf--0.6.28--0.6.29.sql:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf--0.6.29--0.6.30.sql:/usr/share/postgresql/18/extension/pgrdf--0.6.29--0.6.30.sql:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf--0.6.30--0.6.31.sql:/usr/share/postgresql/18/extension/pgrdf--0.6.30--0.6.31.sql:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf--0.6.31--0.6.32.sql:/usr/share/postgresql/18/extension/pgrdf--0.6.31--0.6.32.sql:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf--0.6.32--0.6.33.sql:/usr/share/postgresql/18/extension/pgrdf--0.6.32--0.6.33.sql:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf--0.6.33--0.6.34.sql:/usr/share/postgresql/18/extension/pgrdf--0.6.33--0.6.34.sql:ro,z
      - ./extensions/pgck/lib/pgck.so:/usr/lib/postgresql/18/lib/pgck.so:ro,z
      - ./extensions/pgck/share/extension/pgck.control:/usr/share/postgresql/18/extension/pgck.control:ro,z
      - ./extensions/pgck/share/extension/pgck--0.4.112.sql:/usr/share/postgresql/18/extension/pgck--0.4.112.sql:ro,z
      # The upgrade script is NOT in the builder export (pgrx emits only the
      # per-version install) — mount it from the repo so ALTER EXTENSION
      # pgck UPDATE resolves on this rig, same intent as the pgrdf line above.
      - ../sql/pgck--0.4.31--0.4.32.sql:/usr/share/postgresql/18/extension/pgck--0.4.31--0.4.32.sql:ro,z
      - ../sql/pgck--0.4.32--0.4.33.sql:/usr/share/postgresql/18/extension/pgck--0.4.32--0.4.33.sql:ro,z
      - ../sql/pgck--0.4.33--0.4.34.sql:/usr/share/postgresql/18/extension/pgck--0.4.33--0.4.34.sql:ro,z
      - ../sql/pgck--0.4.34--0.4.35.sql:/usr/share/postgresql/18/extension/pgck--0.4.34--0.4.35.sql:ro,z
      - ../sql/pgck--0.4.35--0.4.36.sql:/usr/share/postgresql/18/extension/pgck--0.4.35--0.4.36.sql:ro,z
