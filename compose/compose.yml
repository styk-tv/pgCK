name: pgck

services:
  postgres:
    container_name: pgck-postgres
    # trixie (Debian 13, glibc 2.41), NOT bookworm. pgRDF v0.6.20 is pg18-only and
    # its .so requires GLIBC_2.38 — bookworm ships 2.36, so the pg17-era bookworm
    # pin can't load the pg18 pgrdf.so ("version `GLIBC_2.38' not found"). trixie is
    # the natural pg18 base (plain postgres:18 == trixie) and clears the floor. The
    # pg17-bookworm SONAME guardrail lifts for pg18: downstream ck-allinone pg18 must
    # likewise be built on a glibc>=2.38 base (trixie/noble), never bookworm.
    image: docker.io/library/postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgck}
      POSTGRES_DB: ${POSTGRES_DB:-pgck}
    command: [postgres, -c, "shared_preload_libraries=pgrdf,pgck"]
    ports: ["${POSTGRES_PORT:-5432}:5432", "${NATS_PORT:-4222}:4222"]
    volumes:
      # postgres:18+ images store data in a major-version subdir and REFUSE a
      # volume mounted directly at /var/lib/postgresql/data (they error to guard
      # against a silent cross-major reuse — docker-library/postgres#1259). The
      # supported 18+ layout mounts the PARENT; data then lands in
      # /var/lib/postgresql/18/docker inside the volume. This is the pg17→pg18
      # switch's one compose gotcha (the .so/ABI moved cleanly).
      - pgdata:/var/lib/postgresql
      - ./extensions/pgrdf/lib/pgrdf.so:/usr/lib/postgresql/18/lib/pgrdf.so:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf.control:/usr/share/postgresql/18/extension/pgrdf.control:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf--0.6.25.sql:/usr/share/postgresql/18/extension/pgrdf--0.6.25.sql:ro,z
      # Complete SQL set per oci-germination packaging (ship the whole share/extension,
      # not just the base install). A stock postgres image is bind-mounted here, so the
      # whole-dir COPY the bundles use would shadow built-in pgcrypto/plpgsql — instead
      # mount every pgrdf--*.sql the 0.6.17 tarball ships. The upgrade script is inert for
      # the warm fresh-install path but keeps ALTER EXTENSION UPDATE resolvable and the
      # mount set == the published artifact's extension dir. Update both filenames on bump.
      - ./extensions/pgrdf/share/extension/pgrdf--0.5.1--0.6.25.sql:/usr/share/postgresql/18/extension/pgrdf--0.5.1--0.6.25.sql:ro,z
      - ./extensions/pgrdf/share/extension/pgrdf--0.6.22--0.6.25.sql:/usr/share/postgresql/18/extension/pgrdf--0.6.22--0.6.25.sql:ro,z
      - ./extensions/pgck/lib/pgck.so:/usr/lib/postgresql/18/lib/pgck.so:ro,z
      - ./extensions/pgck/share/extension/pgck.control:/usr/share/postgresql/18/extension/pgck.control:ro,z
      - ./extensions/pgck/share/extension/pgck--0.4.68.sql:/usr/share/postgresql/18/extension/pgck--0.4.68.sql:ro,z
      # The upgrade script is NOT in the builder export (pgrx emits only the
      # per-version install) — mount it from the repo so ALTER EXTENSION
      # pgck UPDATE resolves on this rig, same intent as the pgrdf line above.
      - ../sql/pgck--0.4.31--0.4.32.sql:/usr/share/postgresql/18/extension/pgck--0.4.31--0.4.32.sql:ro,z
      - ../sql/pgck--0.4.32--0.4.33.sql:/usr/share/postgresql/18/extension/pgck--0.4.32--0.4.33.sql:ro,z
      - ../sql/pgck--0.4.33--0.4.34.sql:/usr/share/postgresql/18/extension/pgck--0.4.33--0.4.34.sql:ro,z
      - ../sql/pgck--0.4.34--0.4.35.sql:/usr/share/postgresql/18/extension/pgck--0.4.34--0.4.35.sql:ro,z
      - ../sql/pgck--0.4.35--0.4.36.sql:/usr/share/postgresql/18/extension/pgck--0.4.35--0.4.36.sql:ro,z
      - ../sql/pgck--0.4.36--0.4.37.sql:/usr/share/postgresql/18/extension/pgck--0.4.36--0.4.37.sql:ro,z
      - ../sql/pgck--0.4.37--0.4.38.sql:/usr/share/postgresql/18/extension/pgck--0.4.37--0.4.38.sql:ro,z
      - ../sql/pgck--0.4.38--0.4.39.sql:/usr/share/postgresql/18/extension/pgck--0.4.38--0.4.39.sql:ro,z
      - ../sql/pgck--0.4.39--0.4.40.sql:/usr/share/postgresql/18/extension/pgck--0.4.39--0.4.40.sql:ro,z
      - ../sql/pgck--0.4.40--0.4.41.sql:/usr/share/postgresql/18/extension/pgck--0.4.40--0.4.41.sql:ro,z
      - ../sql/pgck--0.4.41--0.4.42.sql:/usr/share/postgresql/18/extension/pgck--0.4.41--0.4.42.sql:ro,z
      - ../sql/pgck--0.4.42--0.4.43.sql:/usr/share/postgresql/18/extension/pgck--0.4.42--0.4.43.sql:ro,z
      - ../sql/pgck--0.4.50--0.4.51.sql:/usr/share/postgresql/18/extension/pgck--0.4.50--0.4.51.sql:ro,z
      - ../sql/pgck--0.4.51--0.4.52.sql:/usr/share/postgresql/18/extension/pgck--0.4.51--0.4.52.sql:ro,z
      - ../sql/pgck--0.4.52--0.4.53.sql:/usr/share/postgresql/18/extension/pgck--0.4.52--0.4.53.sql:ro,z
      - ../sql/pgck--0.4.53--0.4.54.sql:/usr/share/postgresql/18/extension/pgck--0.4.53--0.4.54.sql:ro,z
      - ../sql/pgck--0.4.54--0.4.55.sql:/usr/share/postgresql/18/extension/pgck--0.4.54--0.4.55.sql:ro,z
      - ../sql/pgck--0.4.55--0.4.56.sql:/usr/share/postgresql/18/extension/pgck--0.4.55--0.4.56.sql:ro,z
      - ../sql/pgck--0.4.56--0.4.57.sql:/usr/share/postgresql/18/extension/pgck--0.4.56--0.4.57.sql:ro,z
      - ../sql/pgck--0.4.57--0.4.58.sql:/usr/share/postgresql/18/extension/pgck--0.4.57--0.4.58.sql:ro,z
      - ../sql/pgck--0.4.58--0.4.59.sql:/usr/share/postgresql/18/extension/pgck--0.4.58--0.4.59.sql:ro,z
      - ../sql/pgck--0.4.59--0.4.60.sql:/usr/share/postgresql/18/extension/pgck--0.4.59--0.4.60.sql:ro,z
      - ../sql/pgck--0.4.60--0.4.61.sql:/usr/share/postgresql/18/extension/pgck--0.4.60--0.4.61.sql:ro,z
      - ../sql/pgck--0.4.61--0.4.62.sql:/usr/share/postgresql/18/extension/pgck--0.4.61--0.4.62.sql:ro,z
      - ../sql/pgck--0.4.62--0.4.63.sql:/usr/share/postgresql/18/extension/pgck--0.4.62--0.4.63.sql:ro,z
      - ../sql/pgck--0.4.63--0.4.64.sql:/usr/share/postgresql/18/extension/pgck--0.4.63--0.4.64.sql:ro,z
      - ../sql/pgck--0.4.64--0.4.65.sql:/usr/share/postgresql/18/extension/pgck--0.4.64--0.4.65.sql:ro,z
      - ../sql/pgck--0.4.65--0.4.66.sql:/usr/share/postgresql/18/extension/pgck--0.4.65--0.4.66.sql:ro,z
      - ../sql/pgck--0.4.66--0.4.67.sql:/usr/share/postgresql/18/extension/pgck--0.4.66--0.4.67.sql:ro,z
      - ../sql/pgck--0.4.67--0.4.68.sql:/usr/share/postgresql/18/extension/pgck--0.4.67--0.4.68.sql:ro,z
      # v3.11-ONLY ONTOLOGY DELIVERY (0.4.40). This was a v3.7 fixtures corpus
      # (fixtures/ontologies) with three per-file overlays papering over it —
      # core.ttl for the SHACL gate, task.ttl/goal.ttl for the board. All three
      # are gone: boot() now reads /ontology/v3.11/core.ttl, and task/goal are
      # RETIRED (they do not exist in the v3.11 root — measured against the
      # loaded core, digest e5f7d1e5…). The mount is simply the repo's
      # ontology/ — README.md plus v3.11/{core, modules/wave, modules/lexicon},
      # mirrored byte-identically from the CK-org publication surface.
      - ../ontology:/ontology:ro,z
      - ../examples:/examples:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgck} -d ${POSTGRES_DB:-pgck}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
