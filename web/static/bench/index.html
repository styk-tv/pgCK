      <button class="btn go" id="seal" ${S.busy?'disabled':''}>${S.busy?'sealing…':'seal it'}</button>
      <div class="note" style="padding:0 2px">A seal is permanent and carries your name.
        ${isConf ? 'Only a party who is not the owner closes work.' :
          'It is unowned by design and becomes work only when a reader promotes it.'}</div>
    </div>`;
}
async function seal(){
  const t = ($('body')?.value || '').trim();
  if (!t){ S.compose.err = 'Nothing to seal.'; return render(); }
  const isConf = S.compose.kind === 'Confirmation';
  S.compose.text = t; S.compose.err = null; S.busy = true; render();
  const body = isConf
    ? { type: WAVE+'Confirmation', label:(t.split(/\n/)[0]||t).slice(0,150), evidence:t,
        confirmsTicket: S.compose.about }
    : { type: WAVE+'Finding', label:(t.split(/\n/)[0]||t).slice(0,150), reason:t, findingState:'open' };
  try{
    await live();
    const chk = await handle.do('instance.validate', body);
    if (chk && chk.conforms === false){
      S.compose.err = (chk.violations||[]).map(v=>v.message||v).join(' · ') || 'refused by the shape';
      S.busy = false; return render();
    }
    const r = await handle.do('instance.create', body);
    S.busy = false;
    if (r?.id || r?.ok){
      S.compose = null;
      S.sent = { id: r.id, at: Date.now() };
      setTimeout(()=>{ S.sent = null; render(); }, 6000);
      go('#/');
    } else S.compose.err = r?.error || 'refused';
  }catch(e){ S.busy = false; S.compose.err = String(e?.message ?? e); }
  render();
}

/* ═══ THE DOCK — what you DO, in thumb reach, paging the queue ════════════ */
function docked(){
  const asked = inbox().filter(o => o[WAVE+'opKind'] === 'escalate')
    .map(o => String(o[WAVE+'opEvidence']||''))
    .map(e => S.props.find(p => p['@id'] === e))
    .filter(p => p && pending(p) && !iVoted(p['@id']))
    .map(p => ({ p, verb:'approve', asked:true }));
  const seen = new Set(asked.map(x => x.p['@id']));
  const b = buckets();
  return [...asked,
    ...b.act.filter(p => !seen.has(p['@id'])).map(p => ({ p, verb:'approve' })),
    // applyMine only: dockAct treats every verb that is not 'apply' as an approve VOTE, so
    // a queued apply on someone else's kernel would either fail at the door or, worse,
    // fall through to casting a second ballot. Another kernel's agreed-and-unapplied
    // decision is news to relay, not work in this queue.
    ...b.stuck.filter(p => atQuorum(p) && applyMine(p)).map(p => ({ p, verb:'apply' }))];
}
function dockHome(){
  const q = docked(), here = presence();
  const cur = q[Math.min(S.dock, Math.max(q.length-1,0))];
  const line = here.length
    ? `${here.length} sealed here in the last 6h — ${here.slice(0,3).map(h=>h.name).join(', ')}`
    : 'nobody has sealed here in the last 6h';
  if (!q.length) return { people:{ list:here, line }, empty:'nothing is waiting on you here' };
  return {
    people:{ list:here, line },
    prev: S.dock > 0, next: S.dock < q.length-1,
    verb: cur.verb, title: lede(titleOf(cur.p, cur.p[CORE+'proposalOp']||''), 34),
    pos: `${S.dock+1} of ${q.length} · ${cur.verb==='apply' ? 'agreed already — this makes it real'
      : cur.asked ? 'escalated to you by name — you would be the distinct second party'
      : 'you would be a distinct party'}`,
    act: () => dockAct(cur.verb),
  };
}
/* On a fact: page the siblings of the list you came from, and offer the one act
   that fact affords. Seen-by and how-long-ago sit above it. */
function dockEntity(){
  const b = S.entity?.body; if (!b) return null;
  const t = typeOf(b), id = b['@id'];
  const sibs = S.sibs.length ? S.sibs : [id];
  const i = sibs.indexOf(id);
  const seen = [...new Set([...votesOn(id).map(v=>v[CORE+'createdBy']),
    ...(WIRE.get(id)?.by ? [WIRE.get(id).by] : [])])]
    .map(u => ({ name: who(u).name, me: S.me && String(u).endsWith(S.me), at: 0 }));
  const parts = [];
  const vn = votesOn(id).length;
  if (vn) parts.push(`${vn} in the debate`);
  const w = WIRE.get(id);
  if (w?.at) parts.push(`arrived on the wire ${ago(w.at)} ago`);
  if (nsOf(id)) parts.push(`sealed ${ago(nsOf(id))} ago`);
  let verb = 'cite', title = 'copy this permalink', mute = false, act = () => copyLink(id);
  if (t === 'Proposal'){
    const q = b[CORE+'requiresQuorum'] ?? 1, n = parties(id);
    if (!pending(b)){ verb='applied'; title='the decision is already real'; mute=true; }
    else if (!iVoted(id)){
      const gated = recheckOf(b) && !hasRun(id);
      verb='approve'; title = gated ? 'mark the recheck run first' : lede(titleOf(b, b[CORE+'proposalOp']||''), 34);
      mute = gated; act = () => voteHere('approve');
    } else if (n >= q && applyMine(b)){ verb='apply'; title='agreed by enough parties — this makes it real'; act = () => dockAct('apply', b); }
    // NOT muted: mute kills the click (see dact handler), and a dead control with no reason
    // is the exact defect this whole change removes. Copying the permalink is the real move
    // available here — the decision is agreed, it just needs carrying to the kernel that owns it.
    else if (n >= q){ verb='relay';
      title=`agreed by ${n} — ${govOf(b)} applies it; copy the link and tell them`; act = () => copyLink(id); }
    else { verb='waiting'; title=`waits on ${Math.max(0,q-n)} more distinct part${q-n===1?'y':'ies'}`; mute=true; }
  } else if (t === 'Finding' || t === 'Ticket'){
    verb='confirm'; title='seal a Confirmation citing this';
    act = () => { S.compose = { kind:'Confirmation', about:id, text:
      `CONFIRMS ${id}\n\nWHAT I VERIFIED: \n\nHOW: \n\nRECHECK SOMEONE ELSE CAN RUN: `, err:null }; go('#/file'); };
  }
  return {
    // On an Epoch, "nobody else yet" reads as a gap you could close by inviting people. It is
    // a CATEGORY fact: an epoch is structurally private — one kernel's own counter — so no one
    // can ever be collected into it. The commensurable unit is the Pass, where kernels cite one
    // digest. Saying "yet" about something definitional sends people looking for absent friends.
    people:{ list:seen, line: parts.join(' · ') || (t === 'Epoch'
      ? 'no one else can be on this — an epoch is one kernel\'s own counter, not a shared object. The unit that collects kernels is the Pass'
      : 'nobody else has been recorded on this yet') },
    prev: i > 0, next: i >= 0 && i < sibs.length-1,
    prevGo: () => go(`#/i/${encodeURIComponent(sibs[i-1])}`),
    nextGo: () => go(`#/i/${encodeURIComponent(sibs[i+1])}`),
    verb, title, mute, act,
    pos: i >= 0 && sibs.length > 1 ? `${i+1} of ${sibs.length} · swipe to move` : 'the only one in this list',
  };
}
function paintDock(d){
  const el = $('dock');
  if (!d){ el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = `
    <div class="dpeople">
      ${avatars(d.people.list.length ? d.people.list : [{name:'—'}], 6)}
      <span class="dline m">${esc(d.people.line)}</span>
    </div>
    ${d.empty ? `<div class="dpos m" style="padding-bottom:4px">${esc(d.empty)}</div>` : `
      <div class="dbar">
        <button class="dnav" id="dprev" ${d.prev?'':'disabled'}>‹</button>
        <button class="dact${d.mute?' mute':''}" id="dact">
          <span class="dv">${esc(d.verb)}</span><span class="dt">${esc(d.title)}</span></button>
        <button class="dnav" id="dnext" ${d.next?'':'disabled'}>›</button>
      </div>
      <div class="dpos m">${esc(d.pos)}</div>`}`;
  $('dprev')?.addEventListener('click', () => d.prevGo ? d.prevGo() : (S.dock = Math.max(0,S.dock-1), render()));
  $('dnext')?.addEventListener('click', () => d.nextGo ? d.nextGo() : (S.dock = S.dock+1, render()));
  $('dact')?.addEventListener('click', () => { if (!d.mute && d.act) d.act(); });
  S._swipe = d;
}
// swipe pages the same queue the thumb does
let _tx = null;
addEventListener('touchstart', e => { _tx = e.touches[0].clientX; }, { passive:true });
addEventListener('touchend', e => {
  if (_tx == null) return;
  const dx = e.changedTouches[0].clientX - _tx; _tx = null;
  const d = S._swipe; if (!d || Math.abs(dx) < 60) return;
  if (dx < 0 && d.next) (d.nextGo ? d.nextGo() : (S.dock = S.dock+1, render()));
  if (dx > 0 && d.prev) (d.prevGo ? d.prevGo() : (S.dock = Math.max(0,S.dock-1), render()));
}, { passive:true });

async function copyLink(id){
  const url = location.origin + location.pathname + `#/i/${encodeURIComponent(id)}`;
  try{ await navigator.clipboard.writeText(url); }catch{}
  const el = document.querySelector('#dact .dt');
  if (el){ el.textContent = 'permalink copied — the @id survives the handoff'; }
}
async function voteHere(value){
  const p = S.entity?.body; if (!p || S.busy) return;
  S.busy = true; render();
  try{
    await live();
    const r = await handle.do('kernel.vote', { about: p['@id'], value });
    if (r && r.ok === false) S.refusal = { verb:'vote', on: titleOf(p, p[CORE+'proposalOp']||''),
      clause: r.error || 'refused', detail: r.detail || null };
    else { await refresh(); await openEntity(S.entity.id); }
  }catch(e){
    S.refusal = { verb:'vote', on: titleOf(p, p[CORE+'proposalOp']||''), clause:String(e?.message ?? e), detail:null };
  }
  S.busy = false; render();
}
/* A refusal is the shape teaching its contract, so it is rendered as a lesson
   with the clause named — never a red error that vanishes. */
async function dockAct(verb, only){
  const cur = only ? { p:only, verb } : docked()[Math.min(S.dock, Math.max(docked().length-1,0))];
  if (!cur || S.busy) return;
  S.busy = true; S.refusal = null; render();
  try{
    await live();
    const r = verb === 'apply'
      ? await handle.do('kernel.apply', { about: cur.p['@id'] })
      : await handle.do('kernel.vote',  { about: cur.p['@id'], value:'approve' });
    if (r && r.ok === false){
      S.refusal = { verb, on: titleOf(cur.p, cur.p[CORE+'proposalOp']||''),
        clause: r.error || 'refused', detail: r.detail || null };
    } else { S.dock = 0; await refresh(); }
  }catch(e){
    S.refusal = { verb, on: titleOf(cur.p, cur.p[CORE+'proposalOp']||''), clause:String(e?.message ?? e), detail:null };
  }
  S.busy = false; render();
}

/* ── THEME ─────────────────────────────────────────────────────────────── */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t === 'auto' ? '' : t);
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('ck.theme', t);
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme:dark)').matches);
  document.querySelector('meta[name=theme-color]')?.setAttribute('content', dark ? '#0d0d0e' : '#f4f2ec');
}
function applyMotion(on){
  localStorage.setItem('ck.motion', on ? 'on' : 'off');
  document.documentElement.setAttribute('data-motion', on ? 'on' : 'off');
}
applyTheme(localStorage.getItem('ck.theme') || 'auto');
applyMotion(localStorage.getItem('ck.motion') !== 'off');

/* ── WIRING ────────────────────────────────────────────────────────────── */
function wire(){
  $('retry')?.addEventListener('click', () => { liveFails = 0; liveGaveUp = null; live({force:true}); });
  $('kcap')?.addEventListener('click', () => go(S.route.name === 'apps' ? '#/' : '#/apps'));
  $('towave')?.addEventListener('click', () => {
    const w = (S.waves||[]).find(x => S.passes.some(p => p[WAVE+'ofWave'] === x['@id']
      && short(p[CORE+'producedBy']||'') === S.kernel)) || (S.waves||[])[0];
    go(w ? `#/i/${encodeURIComponent(w['@id'])}` : '#/organ/Wave');
  });
  $('orb')?.addEventListener('click', () => go('#/settings'));
  $('nback')?.addEventListener('click', () => { if (history.length > 1) history.back(); else go('#/'); });
  document.querySelectorAll('[data-href]').forEach(b => b.onclick = () => go(b.dataset.href));
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    if (b.dataset.open) go(`#/i/${encodeURIComponent(b.dataset.open)}`);
  });
  document.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { applyTheme(b.dataset.th); render(); });
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    if (b.dataset.act === 'switch') signIn(true);
    if (b.dataset.act === 'out') signOut();
  });
  $('motion')?.addEventListener('click', () => {
    applyMotion(localStorage.getItem('ck.motion') === 'off'); render();
  });
  document.querySelectorAll('[data-kernel]').forEach(b => b.onclick = async () => {
    // Re-read from the same door rather than re-render a cache: a switch that keeps
    // the old rows shows one kernel's facts under another kernel's name.
    S.kernel = b.dataset.kernel; localStorage.setItem('ck.kernel', S.kernel);
    S.T = {}; syncBuckets(); S.facts = []; WIRE.clear(); S.dock = 0;
    go('#/'); await refresh();
  });
  $('file')?.addEventListener('click', () => { S.compose = { kind:'Finding', text:'', err:null }; go('#/file'); });
  $('seal')?.addEventListener('click', seal);
  $('body')?.addEventListener('input', e => { if (S.compose) S.compose.text = e.target.value; });
  $('rclose')?.addEventListener('click', () => { S.refusal = null; render(); });
  $('rfile')?.addEventListener('click', () => {
    const r = S.refusal;
    S.refusal = null;
    S.compose = { kind:'Finding', err:null, text:
      `REFUSED: ${r.verb} on ${r.on}\n\nCLAUSE: ${r.clause}\n\nWHAT I MEASURED: \n\nRECHECK SOMEONE ELSE CAN RUN: ` };
    go('#/file');
  });
  document.querySelectorAll('[data-ran]').forEach(b => b.onclick = () => {
    sessionStorage.setItem(ranKey(b.dataset.ran), String(Date.now())); render();
  });
}

async function openEntity(id){
  S.compose = null;
  S.entity = { id, body:null, err:null };
  render();
  try{
    await ready; await live();
    /* Three ways a body comes back, all measured: a bare id answers COMPACTED, a
       ckp:// URN answers EXPANDED, and a governance URN answers instance:null from
       instance.get while instance.query lists that exact @id. */
    const rawGet = async i => {
      const r = await handle.do('instance.get', { id:i });
      for (const v of [r?.result, r?.instance, r?.body, r?.rows?.[0]?.body, r])
        if (v && typeof v === 'object' && (v['@id'] || v.id)) return v;
      return null;
    };
    const gov = (String(id).match(/^urn:ckp:[^/]+\/(epoch|materialization)\/\d+$/)||[])[1];
    let b = null;
    if (gov){
      const T = gov === 'epoch' ? CORE+'Epoch' : CORE+'Materialization';
      b = (await qType(T)).find(x => x['@id'] === id) || null;
    }
    if (!b) b = await handle.get(id) || await rawGet(id);
    if (!b){
      const m = /^([a-z]+)-\d+$/.exec(id);
      if (m){ const T = m[1][0].toUpperCase()+m[1].slice(1);
        b = await handle.get(`ckp://${T}#${id}`) || await rawGet(`ckp://${T}#${id}`); }
    }
    if (!b){
      const all = [...Object.values(S.T).flat(), ...S.facts];
      b = all.find(x => x['@id'] === id || short(x['@id']) === id) || null;
    }
    S.entity.body = b;
    if (!b) S.entity.err = 'The door returned nothing for that id.';
    else {
      learn(b);
      // Only ask if the wire never said — an envelope already received is cheaper
      // and just as true; it is the substrate's own statement.
      if (WIRE.get(b['@id'])?.seq == null){
        try{
          const pv = await handle.do('instance.provenance', { id });
          const seq = pv?.ledger?.[0]?.seq ?? pv?.seq;
          if (seq != null) S.entity.seq = seq;
        }catch{}
      }
    }
  }catch(e){ S.entity.err = String(e?.message ?? e); }
  render();
}

/* ── BOOT ──────────────────────────────────────────────────────────────── */
$('signin').onclick = () => signIn().catch(e => { $('err').textContent = String(e?.message??e); });

/* A SURFACE THAT SHOWS NOTHING IS INDISTINGUISHABLE FROM A BROKEN ONE.
   Both #gate and #app stay hidden until boot decides which to show, so every
   await before that decision paints an empty page — measured in the field as
   "about a minute of nothing, then the sign-in screen". This states what it is
   waiting for from the first frame, and names the step if it gives up. */
function booting(step){
  const el = $('boot'); if (!el) return;
  el.hidden = false;
  el.innerHTML = `<div class="bootwrap">
    <svg class="bootg"><use href="#g-kernel"/></svg>
    <div class="bootstep m">${esc(step)}</div></div>`;
}
const bootDone = () => { const el = $('boot'); if (el) el.hidden = true; };

// A step that cannot hang forever, and says which one gave up.
const within = (ms, step, p) => Promise.race([
  p,
  new Promise((_, rej) => setTimeout(() =>
    rej(new Error(`${step} did not answer within ${Math.round(ms/1000)}s`)), ms)),
]);

(async function boot(){
  booting('reading your session');
  const p = new URLSearchParams(location.search);
  if (p.get('error')){ bootDone(); $('gate').classList.add('on');
    $('err').textContent = `${p.get('error')}: ${p.get('error_description')||''}`; return; }
  if (p.get('code')){
    try{
      if (p.get('state') !== sessionStorage.getItem('ck.m.s')) throw new Error('state mismatch — refusing the code');
      const v = sessionStorage.getItem('ck.m.v');
      if (!v) throw new Error('no PKCE verifier in this session — start again');
      const r = await fetch(`${OIDC.issuer}/protocol/openid-connect/token`,{
        method:'POST', headers:{'content-type':'application/x-www-form-urlencoded'},
        body:new URLSearchParams({grant_type:'authorization_code', client_id:OIDC.clientId,
          code:p.get('code'), redirect_uri:OIDC.redirect, code_verifier:v})});
      if (!r.ok) throw new Error(`token endpoint ${r.status}: ${(await r.text()).slice(0,200)}`);
      Token.store(await r.json());
      sessionStorage.removeItem('ck.m.v'); sessionStorage.removeItem('ck.m.s');
      const want = sessionStorage.getItem('ck.m.h'); sessionStorage.removeItem('ck.m.h');
      history.replaceState({}, '', location.pathname.replace(/index\.html$/,'') + (want || ''));
    }catch(e){ bootDone(); $('gate').classList.add('on'); $('err').textContent = String(e?.message??e); return; }
  }
  let bootErr = null;
  const tok = await within(12000, 'the identity provider', Token.valid())
    .catch(e => { bootErr = String(e?.message ?? e); return null; });
  if (tok){
    try{ await activate(); }
    catch(e){
      bootDone(); $('gate').classList.add('on');
      $('err').textContent = `${String(e?.message ?? e)} — you are signed in, so this is the door,
        not your identity. Signing in again will not help while the door is silent.`;
    }
  } else {
    bootDone(); $('gate').classList.add('on');
    if (bootErr) $('err').textContent = `${bootErr} — your session could not be checked.`;
  }
})().catch(e => {
  // A boot that dies must not leave a full-screen overlay swallowing every click.
  bootDone(); $('gate').classList.add('on');
  $('err').textContent = `boot failed: ${String(e?.message ?? e)}`;
});
</script>
