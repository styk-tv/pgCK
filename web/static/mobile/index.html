/* ═══ SWITCH CONTEXT — a screen, not a drawer ══════════════════════════════
   One door, one dictionary. Choosing where you stand is not a menu item hiding
   under a corner — it is the act that decides what every other screen means, so
   it gets the whole display and the same row grammar as everything else.
   Each kernel wears its surface digest as a notched, tinted ring: the bench has
   TWO kernels called pgCK at different epochs, and the ring is the only thing
   that tells them apart without renaming anyone.
   ═════════════════════════════════════════════════════════════════════════ */
function kernelRoster(){
  const by = new Map();
  for (const e of S.epochs || []){
    const k = short(e[CORE+'producedBy']||''); if (!k) continue;
    const cur = by.get(k);
    if (!cur || (e[CORE+'epoch']||0) > (cur[CORE+'epoch']||0)) by.set(k, e);
  }
  return [...by.entries()].map(([slug, e]) => ({
    slug,
    epoch: e[CORE+'epoch'],
    digest: e[CORE+'surfaceDigest'],
    decisions: S.props.filter(p => short(p[CORE+'about']||'') === slug
                              || short(p[CORE+'producedBy']||'') === slug).length,
  })).sort((a,b) => a.slug.localeCompare(b.slug));
}

function waveRoster(){
  return (S.waves||[]).map(w => {
    const ps = S.passes.filter(x => x[WAVE+'ofWave'] === w['@id']);
    const kernels = [...new Set(ps.map(x => short(x[CORE+'producedBy']||'')))].filter(Boolean);
    return { id:w['@id'], label: waveName(w) || short(w['@id']),
             blurb: lede(String(w[RDFS+'label']||'').split(/\s+[—–:]\s+/).slice(1).join(' — '), 64),
             passes: ps.length, kernels,
             here: kernels.includes(S.kernel),
             digest: ps.map(x=>x[CORE+'surfaceDigest']).filter(Boolean)[0] };
  }).sort((a,b) => b.passes - a.passes);
}

// A wave label on this bench is a paragraph — w1's carries the entire joining
// protocol. The NAME is what precedes the first em-dash or colon; the rest is
// prose and belongs in the body, not in a masthead four lines tall.
const waveName = w => {
  const raw = String(w?.[RDFS+'label'] || '').trim();
  const name = raw.split(/\s+[—–:]\s+/)[0] || raw;
  return name.length > 34 ? name.slice(0, 33) + '…' : name;
};

function viewSwitch(){
  const ks = kernelRoster(), ws = waveRoster();
  const host = location.host;
  return `<div class="sw">
    <div class="swhead">
      <h2>Switch context</h2>
      <p>one door, one dictionary — the board re-reads live</p>
    </div>

    <div class="swsec m u">door</div>
    <div class="chips">
      <button class="chip on">${esc(host)}</button>
      <span class="chiphint m">the only door this surface is served from — a second
        would mean a second dictionary</span>
    </div>

    <div class="swsec m u">concept kernel${(() => {
      const names = ks.map(k => k.slug.toLowerCase());
      const dup = names.some((n,i) => names.indexOf(n) !== i);
      return dup ? ' — two share a name; the ring is the difference' : '';
    })()}</div>
    ${ks.length ? ks.map(k => `<button class="swrow${k.slug===S.kernel?' cur':''}"
        data-kernel="${esc(k.slug)}">
      <span class="swmark" style="color:${tint(k.digest)}">${ringFor(k.digest,'g')}</span>
      <span class="swt">
        <span class="swn">${esc(k.slug)}</span>
        <span class="swm m">epoch ${esc(k.epoch ?? '—')} · ${esc(k.decisions)} decision${
          k.decisions===1?'':'s'} · ${esc(String(k.digest||'').slice(0,10) || 'no surface')}</span>
      </span>
      ${k.slug===S.kernel?'<span class="cd"></span>':''}
    </button>`).join('') : `<div class="swempty m">no kernel has sealed an epoch</div>`}

    <div class="swsec m u">wave</div>
    ${ws.length ? ws.map(w => `<button class="swrow${w.here?' cur':''}" data-open="${esc(w.id)}">
      <span class="swmark" style="color:${tint(w.digest)}">${ringFor(w.digest,'g')}</span>
      <span class="swt">
        <span class="swn">${esc(w.label)}</span>
        ${w.blurb?`<span class="swb">${esc(w.blurb)}</span>`:''}
        <span class="swm m">${esc(w.passes)} pass${w.passes===1?'':'es'}${
          w.kernels.length?` · ${esc(w.kernels.join(' · '))}`:' · nobody has filed'}${
          w.here ? ' · you are here' : ''}</span>
      </span>
      <span class="swgo">›</span>
    </button>`).join('') : `<div class="swempty m">no wave sealed</div>`}

    <div class="swfoot m">Switching re-reads from the same door. Nothing is cached
      across a switch, because a stale surface is how a reader ends up judging one
      kernel by another's meaning.</div>
  </div>`;
}

function section(id, title, rows, action){
  return `<div class="sec" id="s-${id}">
    <div class="hd m u"><span>${esc(title)}</span>${
      action ? `<button class="act m u" id="file">${esc(action)}</button>` : ''}</div>
    ${rows.length ? `<div class="rows">${rows.join('')}</div>`
                  : `<div class="empty">nothing here — that is the answer, not a gap</div>`}
  </div>`;
}

function rowProposal(p){
  const id = p['@id'], n = parties(id), q = p[CORE+'requiresQuorum'] ?? 1;
  const met = n >= q, applied = (p[CORE+'proposalState']||'') === 'applied';
  const verb = p.proposalDetail?.verb || p[CORE+'proposalOp'] || 'proposal';
  const by = who(p[CORE+'createdBy']);
  return `<button class="row${S.fresh.has(id)?' fresh':''}" data-open="${esc(id)}">
    ${mark(p)}
    <div>
      <div class="meta m">
        <span class="badge">${esc(short(p[CORE+'about']||'') || 'fleet')}</span>
        <span>${esc(ago(nsOf(id)))}</span>
        <span class="actor"><span class="dot k"></span>${esc(by.name)}</span>
        <span class="grow"></span>
        <span class="state ${applied?'':rehearsal(p)?'reh':met?'':'wait'} u">${
          applied ? 'applied' : rehearsal(p) ? 'rehearsal'
          : met ? 'quorum met' : `waits on ${Math.max(0,q-n)}`}</span>
      </div>
      <div class="ttl">${esc(titleOf(p, verb))}</div>
      ${applied ? '' : rehearsal(p)
        ? `<div class="waits m">quorum 1 — one identity would propose, vote and apply</div>`
        : met
        ? `<div class="waits m">quorum met — waiting for someone to apply it</div>`
        : `<div class="waits m">could be closed by ${
            esc(couldClose(id).join(' · ') || 'any verified party')}</div>`}
    </div></button>`;
}
// Everyone who has sealed on this bench and has NOT yet voted here. The
// proposal waits, addressed to nobody; naming the set makes it an invitation.
function couldClose(id){
  const voted = new Set(votesOn(id).map(v => v[CORE+'createdBy']));
  return [...DIR.entries()]
    .filter(([w,e]) => !voted.has(w) && !e.anon && e.n >= 2)
    .sort((a,b) => b[1].n - a[1].n)
    .slice(0, 3)
    .map(([w]) => who(w).name);
}

function titleOf(p, verb){
  const d = p.proposalDetail || {};
  if (d.label) return d.label;
  if (d.verb) return `Register ${d.verb}`;
  if (d.targetClass) return `${verb.replace(/_/g,' ')} for ${term(d.targetClass)}`;
  return `${String(verb).replace(/_/g,' ')} on ${short(p[CORE+'about']||'this bench')}`;
}

// A fact that has no label still HAPPENED, and an id is not an account of it.
// Each kind states itself the way a person would say it out loud.
const term = i => String(i ?? '').split(/[#/]/).pop();
const d8 = d => d ? `${String(d).slice(0,4)}…${String(d).slice(-4)}` : '';
function sentence(f){
  const t = typeOf(f);
  const lab = f[RDFS+'label'] || f.label;
  if (lab) return lab;
  // reason/evidence arrive under several namespaces: declared core:reason, the
  // wave: mint that ck_create warns about, and a Confirmation's own evidence.
  const reason = f[CORE+'reason'] || f[WAVE+'reason'] || f.reason
              || f[WAVE+'evidence'] || f.evidence || f[WAVE+'opEvidence'];
  if (t === 'Vote'){
    const p = S.props.find(x => x['@id'] === f[CORE+'about']);
    const val = f[CORE+'voteValue'] || 'voted';
    return `${who(f[CORE+'createdBy']).name} ${val}d ${p ? `“${titleOf(p, p.proposalDetail?.verb || p[CORE+'proposalOp'] || '')}”` : short(f[CORE+'about']||'a proposal')}`;
  }
  if (t === 'Epoch')
    return `Epoch ${f[CORE+'epoch']} sealed — digest ${d8(f[CORE+'surfaceDigest'])}`;
  if (t === 'Materialization')
    return `Epoch ${f[CORE+'fromEpoch']} → ${f[CORE+'toEpoch']} composed`;
  if (t === 'Adoption')
    return `Adopted ${term(f[CORE+'adopts'] || f[CORE+'adopted'] || '')} — pinned ${d8(f[CORE+'sourceDigest'])}`;
  if (t === 'Proposal') return titleOf(f, f.proposalDetail?.verb || f[CORE+'proposalOp'] || '');
  if (t === 'Membership') return `${who(f[CORE+'memberIs']).name} joined ${term(f[CORE+'memberOf'])}`;
  if (t === 'Confirmation'){
    const of = f[WAVE+'confirmsTicket'] || f.confirmsTicket;
    return lede(reason) || `Confirmed ${of ? short(of) : 'a filing'} — a second party arrived`;
  }
  return lede(reason) || short(f['@id']);
}

function rowFact(f){
  const t = typeOf(f), by = who(f[CORE+'createdBy']);
  const lab = sentence(f);
  const ep = f[CORE+'sealedAtEpoch'];
  return `<button class="row${S.fresh.has(f['@id'])?' fresh':''}" data-open="${esc(f['@id'])}">
    ${mark(f)}
    <div>
      <div class="meta m">
        <span class="badge">${esc(short(f[CORE+'producedBy']||'') || t)}</span>
        <span>${esc(ago(nsOf(f['@id'])))}</span>
        <span class="actor"><span class="dot k"></span>${esc(by.name)}</span>
        <span class="grow"></span>
        ${(() => { const w = WIRE.get(f['@id']);
            return w?.seq != null ? `<span class="state u seq">seq ${esc(w.seq)}</span>`
                 : ep != null ? `<span class="state u">epoch ${esc(ep)}</span>` : ''; })()}
      </div>
      <div class="ttl">${esc(String(lab).slice(0,150))}</div>
    </div></button>`;
}

/* ── DETAIL ────────────────────────────────────────────────────────────── */
/* ═══ WHAT IS NEXT TO THIS ═══════════════════════════════════════════════════
   A sealed fact is never interesting alone, and the edges to its neighbours are
   already in hand — we hold every Pass, Wave, Epoch and Materialization from the
   same refresh. This walks only REAL links and says which kind each one is:
   DECLARED, where the body names the target outright, or DERIVED, where the join
   is inferred and could be wrong. A screen that hides that difference is asking
   to be believed about something it guessed.
   ═════════════════════════════════════════════════════════════════════════ */
function adjacent(b){
  const out = [], t = typeOf(b);
  const kurn = b[CORE+'producedBy'] ?? b.producedBy;
  const kslug = String(kurn||'').match(/^urn:ckp:([^/]+)\/kernel/)?.[1];
  const ep = b[CORE+'sealedAtEpoch'] ?? b.sealedAtEpoch;
  const add = (kind, glyph, rel, id, label, how) =>
    id && out.push({ kind, glyph, rel, id, label, how });

  // THE EPOCH — the surface this was judged against.
  if (kslug && ep != null)
    add('Epoch','g-fact','judged against the surface at', `urn:ckp:${kslug}/epoch/${ep}`,
        `epoch ${ep}`, 'declared');

  // THE PASS, then THE WAVE. A Pass names ofWave outright; the join from a fact
  // to its Pass is by kernel and epoch, which is DERIVED — the nearest pass at or
  // below this epoch on the same kernel. If a pass sits exactly on the epoch the
  // join is tight; otherwise it is the turn this fact fell inside.
  if (kslug && ep != null && t !== 'Wave' && t !== 'Pass'){
    const mine = S.passes
      .filter(p => short(p[CORE+'producedBy']||'') === kslug && (p[CORE+'epoch'] ?? -1) <= ep)
      .sort((a,c) => (c[CORE+'epoch']||0) - (a[CORE+'epoch']||0));
    const pass = mine[0];
    if (pass){
      const exact = (pass[CORE+'epoch'] ?? -1) === ep;
      add('Pass','g-ruling','filed within the pass', pass['@id'],
          `pass at epoch ${pass[CORE+'epoch']}`,
          exact ? 'derived — same kernel and epoch' : 'derived — nearest pass at or below this epoch');
      const wurn = pass[WAVE+'ofWave'];
      const w = S.waves.find(x => x['@id'] === wurn);
      add('Wave','g-adoption','part of the wave', wurn,
          w ? lede(w[RDFS+'label'] || '', 64) : short(wurn||''), 'declared by that pass');
    }
  }

  // WHAT APPLYING IT PRODUCED, and what carried the surface there.
  const applied = b[CORE+'appliedEpoch'];
  if (kslug && applied != null){
    add('Epoch','g-fact','produced the surface at', `urn:ckp:${kslug}/epoch/${applied}`,
        `epoch ${applied}`, 'declared');
    const m = S.mats.find(x => x[CORE+'producesEpoch'] === `urn:ckp:${kslug}/epoch/${applied}`);
    add('Materialization','g-mat','composed by', m?.['@id'],
        m ? `epoch ${m[CORE+'fromEpoch']} → ${m[CORE+'toEpoch']}` : '', 'declared');
  }

  // REVERSE EDGES. A Wave declares nothing but its own label, so everything that
  // makes it a place to arrive at is inbound: the Passes that name it, and through
  // them the kernels that turned up. Without this a wave is a dead end, which is
  // exactly backwards for the one type meant to hold a campaign together.
  if (t === 'Wave'){
    const ps = S.passes.filter(x => x[WAVE+'ofWave'] === b['@id'])
      .sort((a,c)=>(a[CORE+'epoch']||0)-(c[CORE+'epoch']||0));
    const kernels = [...new Set(ps.map(x => short(x[CORE+'producedBy']||'')))].filter(Boolean);
    if (kernels.length) out.push({ kind:'Note', glyph:'g-adoption',
      rel:`${kernels.length} kernel${kernels.length>1?'s':''} filed a pass here`,
      id:ps[0]['@id'], label:kernels.join(' · '), how:'declared by each pass' });
    for (const x of ps){
      const retired = x[CORE+'retiredAtEpoch'] != null;
      add('Pass','g-ruling', retired ? 'a pass, retired' : 'a pass', x['@id'],
        `${short(x[CORE+'producedBy']||'')} at epoch ${x[CORE+'epoch']}`,
        retired ? 'withdrawn by its filer, kept legible' : 'declared');
    }
  }

  // A PASS points back at its wave outright, and holds everything sealed under it.
  if (t === 'Pass'){
    const wurn = b[WAVE+'ofWave'];
    const w = S.waves.find(x => x['@id'] === wurn);
    add('Wave','g-adoption','one turn of the wave', wurn,
        w ? lede(w[RDFS+'label'] || '', 64) : short(wurn||''), 'declared');
    const dir = b[WAVE+'director'];
    if (dir) out.push({ kind:'Note', glyph:'g-ticket', rel:'directed by',
      id:null, label:who(dir).name === '—' ? short(dir) : who(dir).name, how:'declared' });
  }

  // OTHER DECISIONS OF THE SAME KIND — context for whether this is routine.
  if (t === 'Proposal'){
    const op = b[CORE+'proposalOp'];
    const kin = S.props.filter(x => x[CORE+'proposalOp'] === op && x['@id'] !== b['@id']);
    if (kin.length) add('Proposal','g-proposal', `${kin.length} other ${esc(op)} decision${
      kin.length>1?'s':''}`, kin[0]['@id'], lede(titleOf(kin[0], op), 52), 'same op');
  }
  return out;
}

/* ═══ MOVES — WHAT IS OPEN, WHAT IS CLOSED, AND WHERE CLOSED LEADS ═════════
   A node that cannot do one thing can almost always do another, and a surface
   that shows only the permitted buttons teaches that the rest is impossible
   rather than merely shut. So every move is listed: OPEN ones you can take,
   CLOSED ones with the reason they are closed, and — the part that matters —
   the direction each closed one leaves open instead.

   Nothing here is guessed. A move is closed because a shape, a quorum rule or a
   measured refusal says so, and the reason shown is that source. Where the
   substrate would have to be asked (a transition), this says the machine holds
   the answer rather than inventing one — the sealed map is the authority, and
   an illegal move returns its own legal set.
   ═════════════════════════════════════════════════════════════════════════ */
function moves(b){
  const t = typeOf(b), id = b['@id'], out = [];
  const open = (verb, what, how) => out.push({ open:true, verb, what, how });
  const shut = (verb, what, why, instead) => out.push({ open:false, verb, what, why, instead });

  if (t === 'Proposal'){
    const applied = b[CORE+'proposalState'] === 'applied';
    const q = b[CORE+'requiresQuorum'] ?? 1, n = parties(id);
    if (applied){
      shut('vote','second this','it is applied — the decision is already real',
           'read what it produced, and recheck its gate against the surface it claims');
      shut('apply','apply this','already applied', null);
    } else if (iVoted(id)){
      shut('vote','vote again','quorum counts distinct parties, so a second vote from you changes nothing',
           'bring another party — the ballot names who could close it');
      if (n >= q) open('apply','apply it','agreed by enough parties; this makes it real');
      else shut('apply','apply it', `waits on ${Math.max(0,q-n)} more distinct part${q-n===1?'y':'ies'}`,
                'ask by name — an Operation with opTarget reaches a component without routing');
    } else {
      open('vote','approve or reject','you would be a distinct party');
      open('withhold','withhold and file','an evidenced withhold outweighs a reflex approval');
    }
  }

  if (t === 'Finding'){
    const promoted = b[WAVE+'promotedTo'];
    if (promoted) shut('promote','promote it','already promoted — it is someone\'s ticket now', null);
    else shut('promote','promote to a Ticket',
      'instance.update refuses every declared key on this bench, so promotedTo cannot be written by a filer',
      'seal a Confirmation that cites this finding — it records the same judgement and is accepted today');
    open('confirm','confirm it','a second party arriving at the same place is what closes work');
    shut('transition','move findingState',
      'the engine reads the from-state as "planned" while this instance declares "open" — measured at epoch 5',
      'the sealed map is the authority; ask it and it returns the legal set with its refusal');
  }

  if (t === 'Ticket'){
    shut('transition','move ticketState','never render a free list of states — ask the machine',
      'the sealed transition map answers, and an illegal move names the moves that are legal');
    open('confirm','confirm it','only a party who is not the owner can close a ticket');
  }

  if (t === 'Epoch' || t === 'Materialization'){
    shut('any','change it','an epoch is a record of what was in force; nothing edits it',
      'compare it — two surfaces citing one digest are the same surface, whatever the numbers say');
  }

  // ALWAYS OPEN, on anything at all. This is the point of the panel: there is no
  // node from which nothing can be done.
  open('cite','cite it in a filing','every id here is an address another kernel can resolve');
  open('link','send it to someone','the URL carries provenance; a relay does not');
  return out;
}

function movesView(b){
  const rows = moves(b); if (!rows.length) return '';
  const o = rows.filter(r=>r.open), c = rows.filter(r=>!r.open);
  return `<div class="card">
    <div class="cap m u">what you can do here · ${o.length} open · ${c.length} closed</div>
    ${o.map(r => `<div class="mv open">
      <span class="mvk m u">open</span>
      <span class="mvt"><b>${esc(r.what)}</b><span class="mvh"> — ${esc(r.how)}</span></span>
    </div>`).join('')}
    ${c.map(r => `<div class="mv">
      <span class="mvk m u">closed</span>
      <span class="mvt"><b>${esc(r.what)}</b><span class="mvh"> — ${esc(r.why)}</span>
      ${r.instead?`<span class="mvi">instead: ${esc(r.instead)}</span>`:''}</span>
    </div>`).join('')}
  </div>`;
}

function adjacentView(b){
  const rows = adjacent(b);
  if (!rows.length) return '';
  return `<div class="card">
    <div class="cap m u">what is next to this</div>
    ${rows.map(r => `<${r.id?'button':'div'} class="adj${r.id?'':' flat'}"${
      r.id?` data-open="${esc(r.id)}"`:''}>
      <svg class="ag"><use href="#${r.glyph}"/></svg>
      <span class="at">
        <span class="ar m u">${esc(r.rel)}</span>
        <span class="al">${esc(r.label || short(r.id))}</span>
        <span class="ah m">${esc(r.how)}</span>
      </span>
      ${r.id?'<span class="ac">›</span>':''}
    </${r.id?'button':'div'}>`).join('')}
  </div>`;
}

function viewDetail(){
  const e = S.entity;
  if (e.err) return `<div class="empty">${esc(e.err)}<br><span class="m">${esc(e.id)}</span></div>`;

  const isProp = t === 'Proposal';

  const longLab = lab && String(lab).length > 120;
  const head = longLab ? lede(lab, 88)
             : lab || (isProp ? titleOf(b, verb) : sentence(b));

  return `<div class="detail">

      <span class="sep">·</span><span>${esc(who(b[CORE+'createdBy'] ?? b.createdBy).name)}</span>
      ${nsOf(b['@id'])?`<span class="sep">·</span><span>${esc(ago(nsOf(b['@id'])))}</span>`:''}
      ${(S.entity?.seq ?? WIRE.get(b['@id'])?.seq) != null
        ? `<span class="sep">·</span><span>seq ${esc(S.entity?.seq ?? WIRE.get(b['@id'])?.seq)}</span>` : ''}
    </div>

    ${isProp ? ballotCard(b) : ''}
    ${adjacentView(b)}

    ${isProp ? producedCard(b) : ''}
    ${(longLab || reason2 || evid) ? `<div class="card"><div class="prose">${
        prose(longLab ? lab : (evid || reason2))}</div></div>` : ''}
    ${isProp ? detailCard(b) : ''}
    ${movesView(b)}
    ${judgedBar(b)}

/* The quorum card — the comp's centrepiece. Distinct VERIFIED actors, what each
   of them did, and how long ago. Quorum counts parties, not votes, so this
   lists parties. */
/* ═══ THE BALLOT IS A RECHECK, NOT A BUTTON ════════════════════════════════
   pgRDF, operation-1786867038805494000, principle (1): every proposal on this
   wave carries a re-runnable recheck; render it as the PRIMARY action — run
   this, then vote. The doctrine is vote-after-re-run.

   This surface CANNOT run an arbitrary recheck for you: they are instructions
   against the door, sometimes against a shell, and a UI that claimed to have run
   one would be manufacturing the evidence the vote rests on. So it does the
   honest thing — shows the recheck verbatim, and asks you to say you ran it.
   The acknowledgement is local and unsealed; it gates only this screen's buttons
   and is never presented as proof that anything was checked.

   And per the same principle, WITHHOLD-AND-FILE sits beside approve/reject as a
   first-class choice: an evidenced withhold is worth more than a reflex
   approval, so it is not hidden behind a menu.
   ═════════════════════════════════════════════════════════════════════════ */
const RECHECK_RE = /(RECHECK[^.]*|RE-?RUN[^.]*|GATE:[^.]*|close test[^.]*)[.:]?\s*([^]*?)(?=\s+[A-Z]{4,}[ ,:]|$)/i;
function recheckOf(p){
  const d = p.proposalDetail || {};
  const text = [d.note, d.comment, p[CORE+'reason'], p[WAVE+'reason']].filter(Boolean).join(' ');
  const m = RECHECK_RE.exec(text);
  if (!m) return null;
  const body = (m[1] + ' ' + (m[2]||'')).trim();
  return body.length > 20 ? body.slice(0, 600) : null;
}
const ranKey = id => 'ck.ran.' + id;
const hasRun = id => !!sessionStorage.getItem(ranKey(id));

function ballotCard(p){
  const rc = recheckOf(p), id = p['@id'];
  if (!rc) return `<div class="card">
    <div class="cap m u">no recheck offered</div>
    <div class="bw">This proposal carries no re-runnable check. A vote here rests on
      reading it, which is weaker evidence — and worth saying so before you decide.</div>
  </div>`;
  const ran = hasRun(id);
  return `<div class="card ${ran?'':'gate'}">
    <div class="cap m u">${ran ? 'recheck — you marked this run' : 'run this first'}</div>
    <pre class="q m">${esc(rc)}</pre>
    ${ran ? `<div class="bw">Marked as run in this session only. Nothing was sealed and this
      is not evidence — it records that you say you looked.</div>`
      : `<button class="btn" data-ran="${esc(id)}">I ran this</button>
         <div class="bw">Run it against the door yourself. This surface will not run it for
           you, because a check it performed on your behalf is not a check you made.</div>`}
  </div>`;
}

function quorumCard(p){
  const id = p['@id'], q = p[CORE+'requiresQuorum'] ?? 1;
  const by = new Map();
  for (const v of votesOn(id)){
    const w = v[CORE+'createdBy'];
    if (!by.has(w)) by.set(w, v);          // first vote per party; re-votes change nothing
  }
  const rows = [...by.entries()].map(([w,v]) => {
    const d = who(w), me = S.me && String(w).endsWith(S.me);
    return `<div class="who-row">
      <span class="nm m"><span class="dot ${me?'me':'k'}"></span>${esc(d.name)}</span>
      <span class="did m">${esc(d.how||'')} · <span class="yes">${
        esc(v[CORE+'voteValue']||'voted')}</span> · ${esc(ago(nsOf(v['@id'])))}</span>
    </div>`;
  }).join('');
  return `<div class="card${Number(q)<2?' reh':''}">
    <div class="cap m u">${Number(q) < 2
      ? 'quorum 1 — rehearsal, not consensus'
      : `quorum ${esc(q)} — distinct verified actors`}</div>
    ${Number(q) < 2 ? `<div class="bw" style="margin:-4px 0 10px">proposer, voter and
      applier can be one identity — the shape of a decision without having been one</div>` : ''}
    ${rows || `<div class="who-row"><span class="did m">no party has voted yet</span></div>`}
  </div>`;
}

/* WHAT IT PRODUCED, not how it was queried. The comp showed the SPARQL; on a
   phone the query is the machinery and the result is the point, so this states
   the outcome and leaves the mechanism to the desk surface. */
function producedCard(p){
  const applied = (p[CORE+'proposalState']||'') === 'applied';
  if (!applied) return '';
  const ep = p[CORE+'sealedAtEpoch'];
  const d = p.proposalDetail || {};
  const what = d.targetClass ? short(d.targetClass) : (d.verb || p[CORE+'proposalOp'] || 'the surface');
  return `<div class="out">
    <div class="cap m u">second party met · quorum ${esc(p[CORE+'requiresQuorum'] ?? 1)} · applied</div>
    <div class="body">
      <svg class="g"><use href="#g-quorum"/></svg>
      <p>${esc(what)} took effect on this kernel${ep!=null?` at epoch ${esc(ep)}`:''}.
      What changed is sealed and readable by anyone.</p>
    </div>
  </div>`;
}

/* Informed consent: everything the proposal would seal, verbatim, before any
   button. A one-line paraphrase is how a person approves keys they never saw. */
function detailCard(p){
  const d = p.proposalDetail || {};
  const rest = Object.entries(d).filter(([k]) => !['verb','query','params','plane','comment','note'].includes(k));
  if (!rest.length && !d.note) return '';
  return `<div class="card">
    <div class="cap m u">exactly what this changes</div>
    ${d.note ? `<div class="prose" style="margin-bottom:12px">${prose(d.note)}</div>` : ''}
    ${rest.length ? `<div class="res">${rest.map(([k,v]) =>
      `<div class="r m"><span style="color:var(--mut)">${esc(k)}</span> ${
        escLink(typeof v === 'object' ? JSON.stringify(v) : String(v)).slice(0,400)}</div>`).join('')}
      </div>` : ''}
  </div>`;
}

function judgedBar(b){
  const j = b[CORE+'conformsToShape'] ?? b.conformsToShape;
  const st = b[CORE+'proposalState'];
  const seq = S.entity?.seq ?? WIRE.get(b['@id'])?.seq;
  const bits = [ j ? `judged by ${String(j).split(/[#/]/).pop()}` : 'JUDGED BY NOTHING',
                 seq != null ? `seq ${seq}` : null,
                 st || null ].filter(Boolean);
  return `<div class="bar m u ${j?'':'none'}">${bits.map(esc).join(' · ')}</div>`;
}

function actions(p){
  const id = p['@id'], q = p[CORE+'requiresQuorum'] ?? 1;
  if ((p[CORE+'proposalState']||'') === 'applied') return '';
  if (iVoted(id)) return `<div class="bar m u none">you already decided ·
    quorum counts distinct parties, so voting again changes nothing</div>`;
  const rc = recheckOf(p), gated = rc && !hasRun(id);
  return `<button class="btn go" data-vote="approve" ${S.busy||gated?'disabled':''}>approve</button>
    <button class="btn" data-vote="reject" ${S.busy?'disabled':''}>reject</button>
    <button class="btn" data-withhold="${esc(id)}" ${S.busy?'disabled':''}>withhold — and file what you measured</button>
    <div class="note" style="padding:0 2px 6px">${gated
      ? 'approve is closed until you mark the recheck run — reject and withhold stay open, because refusing needs no permission'
      : 'a withheld vote carrying evidence is worth more than an approval that carries none'}</div>`;
}

function provCard(b){
  const w = who(b[CORE+'createdBy'] ?? b.createdBy);
  const k = b[CORE+'producedBy'] ?? b.producedBy;
  const ep = b[CORE+'sealedAtEpoch'] ?? b.sealedAtEpoch;
  const j = b[CORE+'conformsToShape'] ?? b.conformsToShape;
  const eurn = (String(k||'').match(/^urn:ckp:([^/]+)\/kernel/) && ep != null)
    ? `urn:ckp:${String(k).match(/^urn:ckp:([^/]+)\/kernel/)[1]}/epoch/${ep}` : null;
  return `<div class="card">
    <div class="cap m u">provenance — derived, not claimed</div>
    <div class="who-row"><span class="nm m">sealed by</span>
      <span class="did m">${esc(w.name)}${w.how?` · ${esc(w.how)}`:''}${
        WIRE.get(b['@id'])?.by ? ' · <span class="yes">attributed by the substrate on the wire</span>' : ''
      }</span></div>
    <div class="who-row"><span class="nm m">into</span>
      <span class="did m">${esc(short(k||'—'))}</span></div>
    <div class="who-row"><span class="nm m">at epoch</span>
      <span class="did m">${eurn ? `<a class="urn" href="#/i/${encodeURIComponent(eurn)}">${esc(ep)}</a>`
        : esc(ep ?? '—')} — the surface it was judged against</span></div>
    <div class="who-row"><span class="nm m">judged by</span>
      <span class="did m">${j ? esc(String(j).split(/[#/]/).pop())
        : '<span style="color:var(--amber)">NOTHING — ledgered, but no shape looked at it</span>'}</span></div>
  </div>`;
}

/* Presentation only — the shape is the gate, never this. Kernels write in
   ALL-CAPS lead-ins and (1)/(2) enumerations; break on those and change not
   one character. Never a markdown parser over another kernel's seal. */
const CAPS = /(?<=[.;:] )(?=(?:[A-Z][A-Z0-9'’_-]{2,}[ ,:]){1,6}[A-Z(])/g;
const ENUM = /(?<=[.;,:] )(?=\(\d\) )/g;
function prose(t){
  const src = String(t ?? '');
  const ps = /\n\s*\n/.test(src) ? src.split(/\n\s*\n/)
           : src.split(CAPS).flatMap(x => x.split(ENUM));
  return ps.map(x=>x.trim()).filter(Boolean).map(x=>`<p>${escLink(x)}</p>`).join('');
}

/* ── FILE: one box, because a person pastes what they measured and should not
   be made to fill a form. First line becomes the label, the whole text the
   reason. Dry-run at the door FIRST — a refusal names the clause and writes
   nothing; this app never judges, it only asks. ─────────────────────────── */
function viewCompose(){
  const c = S.compose;
  return `<div class="detail">
    <div class="hero">
      ${glyph('Finding')}
      <div class="kind m">wave:Finding</div>
      <h2>File what you measured</h2>
    </div>
    <div class="card">
      <div class="cap m u">what happened — measured, not guessed</div>
      <textarea id="body" rows="9" placeholder="Paste it. The first line becomes the summary; the whole text is the record.

what you measured · how · what it breaks, by identifier · the ask, and of whom · a close test someone else can run">${esc(c.text||'')}</textarea>
    </div>
    <div class="card">
      <div class="cap m u">filled in for you — sealed exactly as shown</div>
      <div class="who-row"><span class="nm m">findingState</span><span class="did m">open</span></div>
      <div class="who-row"><span class="nm m">createdBy</span>
        <span class="did m">${esc(S.meName)} — derived by the substrate, you cannot set it</span></div>
    </div>
    ${c.err?`<div class="bar m u" style="border-color:var(--amber);color:var(--amber);background:transparent">${esc(c.err)}</div>`:''}
    <button class="btn go" id="seal" ${S.busy?'disabled':''}>${S.busy?'sealing…':'seal it'}</button>
    <div class="note" style="padding:0 2px">A seal is permanent and carries your name.
      It is unowned by design and becomes work only when a reader promotes it.</div>
  </div>`;
}

async function seal(){
  const t = ($('body')?.value || '').trim();
  if (!t){ S.compose.err = 'Nothing to seal.'; return render(); }
  S.compose.text = t; S.compose.err = null; S.busy = true; render();
  const body = {
    type: WAVE + 'Finding',
    label: (t.split(/\n/)[0] || t).slice(0, 150),
    reason: t,
    findingState: 'open',
  };
  try{
    await live();
    const chk = await handle.do('instance.validate', body);
    if (chk && chk.conforms === false){
      S.compose.err = (chk.violations||[]).map(v=>v.message||v).join(' · ') || 'refused by the shape';
      S.busy = false; return render();
    }
    const r = await handle.do('instance.create', body);
    S.busy = false;
    if (r?.id || r?.ok){
      S.compose = null;
      S.sent = { id: r.id, at: Date.now() };
      // Do not re-query: our own seal comes back over the same socket everyone
      // else receives it on. If it does not arrive, that is a finding.
      setTimeout(()=>{ S.sent = null; render(); }, 6000);
    } else S.compose.err = r?.error || 'refused';
  }catch(e){ S.busy = false; S.compose.err = String(e?.message ?? e); }
  render();
}

/* ── MENU ──────────────────────────────────────────────────────────────── */
function menuHtml(){
  const th = localStorage.getItem('ck.theme') || 'auto';
  const seg = (v,l) => `<button data-th="${v}" aria-pressed="${th===v}">${l}</button>`;
  return `<div class="menu" role="menu">
    <div class="whoami"><div class="l">signed in as</div><div class="v">${esc(S.meName)}</div>
      <div class="l" style="margin-top:9px">the door</div>
      <div class="v m" style="font-size:11px;line-height:1.5">${esc(wireLine())}</div></div>
    <div class="seg">${seg('light','Light')}${seg('dark','Dark')}${seg('auto','Auto')}</div>
    <button class="item" data-act="switch"><span class="ic">⇄</span>Switch user…</button>
    <button class="item danger" data-act="out"><span class="ic">⏻</span>Sign out</button>
  </div>`;
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t === 'auto' ? '' : t);
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('ck.theme', t);
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme:dark)').matches);
  document.querySelector('meta[name=theme-color]')?.setAttribute('content', dark ? '#0d0d0e' : '#f4f2ec');
}
applyTheme(localStorage.getItem('ck.theme') || 'auto');

/* ── WIRING ────────────────────────────────────────────────────────────── */
function wire(){
  $('pill')?.addEventListener('click', e => { e.stopPropagation(); S.menu = !S.menu; render(); });
  document.querySelectorAll('[data-th]').forEach(b =>
    b.onclick = e => { e.stopPropagation(); applyTheme(b.dataset.th); render(); });
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    S.menu = false;
    if (b.dataset.act === 'switch') signIn(true);
    if (b.dataset.act === 'out') signOut();
  });
  document.querySelectorAll('[data-open]').forEach(b =>
    b.onclick = () => { location.hash = `#/i/${encodeURIComponent(b.dataset.open)}`; });
  document.querySelectorAll('[data-jump]').forEach(b =>
    b.onclick = () => $('s-'+b.dataset.jump)?.scrollIntoView({behavior:'smooth', block:'start'}));
  $('toswitch')?.addEventListener('click', () => { location.hash = '#/switch'; });
  $('rclose')?.addEventListener('click', () => { S.refusal = null; render(); });
  $('dprev')?.addEventListener('click', () => { S.dock = Math.max(0, S.dock-1); render(); });
  $('dnext')?.addEventListener('click', () => { S.dock = S.dock+1; render(); });
  $('dact')?.addEventListener('click', e => dockAct(e.currentTarget.dataset.verb));
  document.querySelectorAll('[data-kernel]').forEach(b => b.onclick = async () => {
    // Re-read from the same door rather than re-render a cache: a switch that
    // keeps the old rows shows one kernel's facts under another kernel's name.
    S.kernel = b.dataset.kernel; S.switching = false;
    S.facts = []; S.props = []; S.votes = []; WIRE.clear();
    location.hash = '#/';
    await refresh();
  });
  $('back')?.addEventListener('click', () => { if (S.compose){ S.compose = null; return render(); } history.back(); });
  $('upto')?.addEventListener('click', () => {
    if (S.compose){ S.compose = null; return render(); }
    location.hash = '#/';
  });
  $('file')?.addEventListener('click', () => { S.compose = { text:'', err:null }; S.entity = null; render(); });
  $('seal')?.addEventListener('click', seal);
  $('body')?.addEventListener('input', e => { S.compose.text = e.target.value; });
  document.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => vote(b.dataset.vote));
  document.querySelectorAll('[data-ran]').forEach(b => b.onclick = () => {
    sessionStorage.setItem(ranKey(b.dataset.ran), String(Date.now())); render();
  });
  document.querySelectorAll('[data-withhold]').forEach(b => b.onclick = () => {
    // A withhold is not a vote and must not seal as one: it opens a Finding that
    // says what was measured, and leaves the proposal untouched for a party who
    // can carry it.
    const p = S.entity?.body;
    S.compose = { text: `WITHHELD on ${p?.['@id']||b.dataset.withhold} — I did not vote, and this is why.\n\n`
      + `WHAT I MEASURED: \n\nWHAT WOULD CHANGE MY MIND: \n\nRECHECK SOMEONE ELSE CAN RUN: `,
      err:null };
    S.entity = null; render();
  });
}
addEventListener('click', e => { if (S.menu && !e.target.closest('.wrap')){ S.menu = false; render(); } });
addEventListener('keydown', e => { if (e.key === 'Escape' && S.menu){ S.menu = false; render(); } });

async function vote(value){
  const p = S.entity?.body; if (!p) return;
  S.busy = true; render();
  try{
    await live();
    await handle.do('kernel.vote', { about: p['@id'], value });
    await refresh();
    await openEntity(S.entity.id);
  }catch(err){
    S.entity.err = String(err?.message ?? err);
  }
  S.busy = false; render();
}

/* The dock acts on the card it is showing, and NEVER silently: a refusal is the
   shape teaching its contract, so it is rendered as a lesson with the clause
   named, not as a red error that vanishes. (SPEC.ICONS.v3.11, "REFUSALS ARE
   RESULTS", and the design drop's own resendCorrected / closeRefusal.) */
async function dockAct(verb){
  const q = docked(); const cur = q[Math.min(S.dock, q.length-1)];
  if (!cur || S.busy) return;
  S.busy = true; S.refusal = null; render();
  try{
    await live();
    const r = verb === 'apply'
      ? await handle.do('kernel.apply', { about: cur.p['@id'] })
      : await handle.do('kernel.vote',  { about: cur.p['@id'], value:'approve' });
    if (r && r.ok === false){
      S.refusal = { verb, on: titleOf(cur.p, cur.p[CORE+'proposalOp']||''),
                    clause: r.error || 'refused', detail: r.detail || null };
    } else {
      S.dock = 0;
      await refresh();
    }
  }catch(e){
    S.refusal = { verb, on: titleOf(cur.p, cur.p[CORE+'proposalOp']||''),
                  clause: String(e?.message ?? e), detail:null };
  }
  S.busy = false; render();
}

/* ── ROUTING ───────────────────────────────────────────────────────────── */
async function readRoute(){
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/,''));
  const seg = raw.split('/');
  if (seg[0] === 'switch'){ S.switching = true; S.entity = null; S.compose = null; return render(); }
  if (seg[0] === 'i' && seg[1]) return openEntity(seg.slice(1).join('/'));
  S.switching = false; S.entity = null; render();
}
addEventListener('hashchange', readRoute);

async function openEntity(id){
  S.compose = null;
  S.entity = { id, body:null, err:null };
  render();
  try{
    await ready; await live();
    /* Three ways a body comes back, all measured on this bench:
       a bare id answers COMPACTED, a ckp:// URN answers EXPANDED, and a
       governance URN (urn:ckp:<k>/epoch/<n>) answers instance:null from
       instance.get while instance.query lists that exact @id. */
    const rawGet = async i => {
      const r = await handle.do('instance.get', { id:i });
      for (const v of [r?.result, r?.instance, r?.body, r?.rows?.[0]?.body, r])
        if (v && typeof v === 'object' && (v['@id'] || v.id)) return v;
      return null;
    };
    const gov = (String(id).match(/^urn:ckp:[^/]+\/(epoch|materialization)\/\d+$/)||[])[1];
    let b = null;
    if (gov){
      const T = gov === 'epoch' ? CORE+'Epoch' : CORE+'Materialization';
      b = (await qType(T)).find(x => x['@id'] === id) || null;
    }
    if (!b) b = await handle.get(id) || await rawGet(id);
    if (!b){
      const m = /^([a-z]+)-\d+$/.exec(id);
      if (m){ const T = m[1][0].toUpperCase()+m[1].slice(1);
        b = await handle.get(`ckp://${T}#${id}`) || await rawGet(`ckp://${T}#${id}`); }
    }
    if (!b) b = S.props.find(p => p['@id'] === id || short(p['@id']) === id)
             || S.facts.find(f => f['@id'] === id || short(f['@id']) === id) || null;
    S.entity.body = b;
    if (!b) S.entity.err = 'The door returned nothing for that id.';
    else {
      learn(b);
      /* the ledger sequence, if this door will give it — omitted rather than
         invented when it will not */
      // Only ask if the wire never said. An envelope we already received is
      // cheaper and just as true — it is the substrate's own statement.
      if (WIRE.get(b['@id'])?.seq == null){
        try{
          const pv = await handle.do('instance.provenance', { id });
          const seq = pv?.ledger?.[0]?.seq ?? pv?.seq;
          if (seq != null) S.entity.seq = seq;
        }catch{}
      }
    }
  }catch(e){ S.entity.err = String(e?.message ?? e); }
  render();
}

/* ── BOOT ──────────────────────────────────────────────────────────────── */
$('signin').onclick = () => signIn().catch(e => { $('err').textContent = String(e?.message??e); });

(async function boot(){
  const p = new URLSearchParams(location.search);
  if (p.get('error')){ $('gate').classList.add('on');
    $('err').textContent = `${p.get('error')}: ${p.get('error_description')||''}`; return; }
  if (p.get('code')){
    try{
      if (p.get('state') !== sessionStorage.getItem('ck.m.s')) throw new Error('state mismatch — refusing the code');
      const v = sessionStorage.getItem('ck.m.v');
      if (!v) throw new Error('no PKCE verifier in this session — start again');
      const r = await fetch(`${OIDC.issuer}/protocol/openid-connect/token`,{
        method:'POST', headers:{'content-type':'application/x-www-form-urlencoded'},
        body:new URLSearchParams({grant_type:'authorization_code', client_id:OIDC.clientId,
          code:p.get('code'), redirect_uri:OIDC.redirect, code_verifier:v})});
      if (!r.ok) throw new Error(`token endpoint ${r.status}: ${(await r.text()).slice(0,200)}`);
      Token.store(await r.json());
      sessionStorage.removeItem('ck.m.v'); sessionStorage.removeItem('ck.m.s');
      const want = sessionStorage.getItem('ck.m.h'); sessionStorage.removeItem('ck.m.h');
      history.replaceState({}, '', location.pathname.replace(/index\.html$/,'') + (want || ''));
    }catch(e){ $('gate').classList.add('on'); $('err').textContent = String(e?.message??e); return; }
  }
  if (await Token.valid()){
    try{ await activate(); }
    catch(e){ $('gate').classList.add('on'); $('err').textContent = String(e?.message??e); }
  } else $('gate').classList.add('on');
})();
</script>
